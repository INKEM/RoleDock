# P6-G7 .deb packaging (desktop-gui-contract §8: .deb is the ONLY first-release
# install format candidate). Same runtime/vendor/schemas extraResources layout
# as the shell config; the deb target adds the installable package metadata.
# No ZCode account, no personal helper, no test directories are packaged.
appId: org.roledock.desktop
productName: roledock-desktop
directories:
  output: dist-app-shell
  buildResources: build
files:
  - dist-desktop/shell/**
  - dist-desktop/vendor/**
  - dist-desktop/schemas/**
  - package.json
asar: true
extraMetadata:
  main: dist-desktop/shell/main.mjs
extraResources:
  - from: .cache/runtime/node-v22.23.2-linux-x64
    to: runtime/node
  - from: dist-desktop/vendor
    to: runtime/vendor
  - from: dist-desktop/schemas
    to: runtime/schemas
linux:
  artifactName: "${name}-${version}-${arch}.${ext}"
  target:
    - deb
  category: Development
  executableName: roledock-desktop
  maintainer: roledock developers
  # The packaged app carries its own UI, service, connector bundles and the
  # locked Node runtime; external dependencies (ZCode CLI, helper) are the
  # user's declared environment and diagnosed by the preflight, never bundled.
