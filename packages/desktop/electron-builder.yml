# P6-G0 probe packaging (electron-builder 26.18.0).
# The packaged probe verifies that the fixed Node 22.23.2 runtime and the
# service/MCP bundles resolve from process.resourcesPath (DESKTOP_GUI_PLAN §8).
appId: org.roledock.desktop-probe
productName: roledock-desktop-probe
directories:
  output: dist-app
  buildResources: build
files:
  - dist-desktop/**
  - package.json
asar: true
extraResources:
  - from: .cache/runtime/node-v22.23.2-linux-x64
    to: runtime/node
  - from: dist-desktop/vendor
    to: runtime/vendor
  - from: dist-desktop/schemas
    to: runtime/schemas
linux:
  artifactName: "${name}-${version}-${arch}.${ext}"
  target:
    - dir
  category: Development
  executableName: roledock-desktop-probe
  maintainer: roledock developers
